name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download release jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Structures-*.jar' --dir dist

      - name: Fetch release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > CHANGELOG.md

      - name: Publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            dist/Structures-*.jar
          name: Structures ${{ github.event.release.tag_name || inputs.tag }}
          version: ${{ github.event.release.tag_name || inputs.tag }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: |
            bukkit
            spigot
            paper
            purpur
            folia
          game-versions: |
            >=1.21
          java: 21
